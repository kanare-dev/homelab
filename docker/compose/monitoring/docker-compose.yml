# INC-2026-10-22: コンテナログがディスクを圧迫しないよう上限を設ける
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/ha_token:/etc/prometheus/ha_token:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=5GB"   # 暫定値。実測に基づいて調整
      - "--web.enable-lifecycle"
    logging: *default-logging
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/slack_webhook_url:/etc/alertmanager/slack_webhook_url:ro
      - ./alertmanager/slack_webhook_url_warning:/etc/alertmanager/slack_webhook_url_warning:ro
      - ./alertmanager/slack_webhook_url_environment:/etc/alertmanager/slack_webhook_url_environment:ro
      - ./alertmanager/heartbeat_ping_url:/etc/alertmanager/heartbeat_ping_url:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      # Slack 通知のタイトルのリンク先（既定ではコンテナ ID のホスト名になり、ブラウザから開けない）
      - "--web.external-url=https://alertmanager.lab.kanare.dev"
    logging: *default-logging
    networks:
      - monitoring

  # 外形監視。Prometheus からだけ使うので、ポートは公開しない
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    # ホストの DNS（ルーター）は lab.kanare.dev を引けない。クライアントと同じ AdGuard を使う
    dns:
      - 10.77.20.10
    logging: *default-logging
    networks:
      - monitoring

  # AdGuard Home のクエリ数・ブロック率・上流の応答時間（docs/architecture/lld/platform/monitoring.md）。
  # AdGuard の API に管理者の権限で入るので、コードを読んだ版（v1.2.3）にダイジェストで固定する（ADR-0038）。
  # /metrics には、どの端末がどのドメインを引いたかが出るので、ポートは公開しない（Prometheus からだけ使う）
  adguard-exporter:
    image: ghcr.io/henrywhitaker3/adguard-exporter:v1.2.3@sha256:27244b698034a190d657417fe1231db02cf2d22931d238495fd1a32bd0957185
    container_name: adguard-exporter
    restart: unless-stopped
    environment:
      # 平文の :3000 ではなく、Caddy 経由の HTTPS で読む（Basic 認証の情報を暗号化して送るため）
      - ADGUARD_SERVERS=https://adguard.lab.kanare.dev
      - ADGUARD_USERNAMES=exporter
      - ADGUARD_PASSWORDS_FILE=/run/secrets/adguard_exporter_password
      - INTERVAL=30s
    volumes:
      - ./adguard-exporter/password:/run/secrets/adguard_exporter_password:ro
    # ホストの DNS（ルーター）は lab.kanare.dev を引けない。blackbox-exporter と同じく AdGuard を使う
    dns:
      - 10.77.20.10
    logging: *default-logging
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/node-exporter-full.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    logging: *default-logging
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  monitoring:
    driver: bridge
