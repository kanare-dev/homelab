global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: "node"
    static_configs:
      - targets: ["10.77.10.10:9100"]   # proxmox
        labels:
          env: "homelab"
          host: "pve01"
          role: "proxmox"
      - targets: ["10.77.20.10:9100"]   # vm-infra
        labels:
          env: "homelab"
          host: "vm-infra"
          role: "infra"
      - targets: ["10.77.10.3:9100"]   # vm-omada
        labels:
          env: "homelab"
          host: "vm-omada"
          role: "omada"
      - targets: ["10.77.20.11:9100"]   # vm-monitoring
        labels:
          env: "homelab"
          host: "vm-monitoring"
          role: "monitoring"
      - targets: ["10.77.20.20:9100"]   # vm-apps
        labels:
          env: "homelab"
          host: "vm-apps"
          role: "apps"
      - targets: ["10.77.40.10:9100"]   # vm-dev
        labels:
          env: "homelab"
          host: "vm-dev"
          role: "dev"
      - targets: ["10.77.20.30:9100"]   # vm-code
        labels:
          env: "homelab"
          host: "vm-code"
          role: "code"
    relabel_configs:
      - source_labels: ["host"]
        target_label: instance

  # 室内の温度・湿度（SwitchBot Hub 2）。Home Assistant の Prometheus 連携から取る。
  # HA は SwitchBot Cloud をポーリングして値を更新するので、短い間隔で取っても意味がない。
  # トークンは Ansible が SOPS（prometheus_ha_token）から /etc/prometheus/ha_token に置く
  - job_name: "homeassistant"
    metrics_path: /api/prometheus
    scrape_interval: 60s
    authorization:
      credentials_file: /etc/prometheus/ha_token
    static_configs:
      - targets: ["10.77.20.20:8123"]   # vm-apps（Home Assistant。host ネットワーク）
        labels:
          env: "homelab"
          host: "vm-apps"
          service: "homeassistant"
    relabel_configs:
      - target_label: instance
        replacement: "homeassistant"

  # AdGuard Home の統計（adguard-exporter。同じ compose のコンテナ）。
  # exporter が AdGuard を読む間隔（INTERVAL=30s）より短く取っても、値は変わらない
  - job_name: "adguard"
    scrape_interval: 30s
    static_configs:
      - targets: ["adguard-exporter:9618"]
        labels:
          env: "homelab"
          host: "vm-monitoring"
          service: "adguard-exporter"
    relabel_configs:
      - target_label: instance
        replacement: "adguard-exporter"

  # 外形監視: Caddy 経由の HTTPS サービス（URL・証明書の期限）。
  # host は背後の VM。TargetDown と同じ host で抑制する（alertmanager.yml）。
  - job_name: "blackbox_http"
    metrics_path: /probe
    params:
      module: [http_service]
    scrape_interval: 30s
    static_configs:
      - targets: ["https://grafana.lab.kanare.dev"]
        labels: { host: "vm-monitoring", service: "grafana" }
      - targets: ["https://prometheus.lab.kanare.dev"]
        labels: { host: "vm-monitoring", service: "prometheus" }
      - targets: ["https://alertmanager.lab.kanare.dev"]
        labels: { host: "vm-monitoring", service: "alertmanager" }
      - targets: ["https://pve.lab.kanare.dev"]
        labels: { host: "pve01", service: "pve" }
      - targets: ["https://home.lab.kanare.dev"]
        labels: { host: "vm-apps", service: "homepage" }
      - targets: ["https://ha.lab.kanare.dev"]
        labels: { host: "vm-apps", service: "homeassistant" }
      - targets: ["https://n8n.lab.kanare.dev"]
        labels: { host: "vm-apps", service: "n8n" }
      - targets: ["https://rss.lab.kanare.dev"]
        labels: { host: "vm-apps", service: "freshrss" }
      - targets: ["https://adguard.lab.kanare.dev"]
        labels: { host: "vm-infra", service: "adguard" }
      - targets: ["https://code.lab.kanare.dev"]
        labels: { host: "vm-code", service: "code-server" }
      - targets: ["https://cloudcli.lab.kanare.dev"]
        labels: { host: "vm-code", service: "cloudcli" }
      - targets: ["https://omada.lab.kanare.dev"]
        labels: { host: "vm-omada", service: "omada" }
    relabel_configs:
      - source_labels: ["__address__"]
        target_label: __param_target
      - source_labels: ["__param_target"]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # 外形監視: vm-infra の AdGuard Home に名前を引く
  - job_name: "blackbox_dns"
    metrics_path: /probe
    scrape_interval: 30s
    static_configs:
      - targets: ["10.77.20.10:53"]
        labels: { host: "vm-infra", service: "dns-lab", module: "dns_lab" }
      - targets: ["10.77.20.10:53"]
        labels: { host: "vm-infra", service: "dns-external", module: "dns_external" }
    relabel_configs:
      - source_labels: ["module"]
        target_label: __param_module
      - source_labels: ["__address__"]
        target_label: __param_target
      - source_labels: ["service"]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # 外形監視: 疎通と遅延（ICMP）。ルーター → 建物の共用ルーター → インターネットの順に、
  # どこまで届くかを切り分ける。建物の共用ルーター（172.22.0.1）は traceroute の 2 ホップ目。
  # 引っ越しなどで上流が変わったら、このアドレスを直す（docs/architecture/hld/05-network.md）
  - job_name: "blackbox_icmp"
    metrics_path: /probe
    params:
      module: [icmp]
    scrape_interval: 30s
    static_configs:
      - targets: ["10.77.20.1"]   # vm-monitoring と同じ VLAN（Servers）のルーターのアドレス
        labels: { host: "router", service: "gateway" }
      - targets: ["172.22.0.1"]
        labels: { host: "building", service: "building-router" }
      - targets: ["1.1.1.1"]
        labels: { host: "internet", service: "internet-cloudflare" }
      - targets: ["8.8.8.8"]
        labels: { host: "internet", service: "internet-google" }
    relabel_configs:
      - source_labels: ["__address__"]
        target_label: __param_target
      - source_labels: ["service"]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
