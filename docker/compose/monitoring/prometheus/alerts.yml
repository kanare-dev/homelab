groups:
  - name: storage
    rules:
      # INC-2026-10-22: LVM thin pool 枯渇で全 VM が io-error になった
      - alert: LvmThinPoolDataHigh
        expr: lvm_thin_pool_data_percent > 75
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "thin pool {{ $labels.vg }}/{{ $labels.pool }} の使用率が {{ $value | printf \"%.1f\" }}%"
          description: "75% 超。90% を超えると critical。VM 内で fstrim を実行し、容量の増加要因を確認する。"

      - alert: LvmThinPoolDataCritical
        expr: lvm_thin_pool_data_percent > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "thin pool {{ $labels.vg }}/{{ $labels.pool }} の使用率が {{ $value | printf \"%.1f\" }}%（枯渇間近）"
          description: "100% で全 VM が io-error になる。至急 pool 拡張または容量回収を行う。docs/operations/incidents/2026-10-22-lvm-thin-exhaustion.md 参照。"

      # 仮想ディスク合計 ÷ pool サイズ。1 を超えると、全 VM が使い切る前に pool が尽きる。
      # INC-2026-10-22 の障害時は約 1.6（現在は 1.44）。discard が効いていても、増やしすぎない歯止めにする
      - alert: LvmThinPoolOverprovisioned
        expr: lvm_thin_pool_provisioned_bytes / lvm_thin_pool_size_bytes > 1.5
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "thin pool {{ $labels.vg }}/{{ $labels.pool }} の割当比率が {{ $value | printf \"%.2f\" }}（仮想サイズ合計が pool の 1.5 倍超）"
          description: "VM ディスクを増やしすぎている。pool の拡張、ディスクの縮小、不要な VM の削除を検討する。使用率が低くても、全 VM が使い切れば枯渇する。"

      - alert: LvmThinPoolMetadataHigh
        expr: lvm_thin_pool_metadata_percent > 75
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "thin pool {{ $labels.vg }}/{{ $labels.pool }} のメタデータ使用率が {{ $value | printf \"%.1f\" }}%"

      - alert: LvmThinPoolMetadataCritical
        expr: lvm_thin_pool_metadata_percent > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "thin pool {{ $labels.vg }}/{{ $labels.pool }} のメタデータが枯渇間近（{{ $value | printf \"%.1f\" }}%）"

      - alert: PveVmIoError
        expr: pve_vm_io_error == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "VM {{ $labels.name }} ({{ $labels.vmid }}) が io-error で停止中"
          description: "ストレージ容量枯渇の可能性が高い。pool を拡張してから qm resume する。"

      # onboot=1 の VM が停止している（シャットダウン・クラッシュ・手動停止）
      - alert: PveVmStopped
        expr: pve_vm_running{onboot="1"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "VM {{ $labels.name }} ({{ $labels.vmid }}) が停止している"
          description: "onboot=1 の VM が running でない。PVE の UI または qm start で確認する。"

      - alert: PveStorageMetricsStale
        expr: time() - pve_storage_metrics_last_run_timestamp_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PVE の thin pool メトリクスが 5 分以上更新されていない"
          description: "pve-storage-metrics.timer が停止している可能性。この間 thin pool を監視できない。"

      - alert: PveStorageMetricsMissing
        expr: absent(lvm_thin_pool_data_percent)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "thin pool のメトリクスが存在しない"

      - alert: HostDiskUsageHigh
        expr: |
          100 * (1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs"}) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} の {{ $labels.mountpoint }} が {{ $value | printf \"%.1f\" }}%"

      - alert: HostDiskUsageCritical
        expr: |
          100 * (1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs"}) > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} の {{ $labels.mountpoint }} が {{ $value | printf \"%.1f\" }}%"

  - name: memory
    rules:
      # vm-code が開発中に OOM でハングした（応答不能になり、TargetDown まで気づけなかった）。
      # スワップなしの VM では MemAvailable が尽きる前に検知する。vm-dev は手動起動のため、起動中のみ評価される
      - alert: HostMemoryLow
        expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} の利用可能メモリが {{ $value | printf \"%.1f\" }}%"
          description: "10% 未満。OOM でハングする前にプロセスを確認するか、VM のメモリ割当を増やす。"

      - alert: HostMemoryCritical
        expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} の利用可能メモリが {{ $value | printf \"%.1f\" }}%（OOM 間近）"
          description: "5% 未満。応答不能になる前に、重いプロセスを止めるか VM のメモリを増やす。"

      - alert: HostOomKilled
        expr: increase(node_vmstat_oom_kill[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} で OOM killer がプロセスを終了させた"
          description: "`dmesg | grep -i oom` で対象を確認する。再発するならメモリ割当を増やす。"

  - name: cpu
    rules:
      # 全コアの平均使用率（idle 以外）。一時的なビルドや起動直後のスパイクで鳴らないよう、待ち時間を長めに取る。
      # vm-dev は手動起動のため、起動中のみ評価される
      - alert: HostCpuHigh
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} の CPU 使用率が {{ $value | printf \"%.1f\" }}%"
          description: "85% 超が 15 分続いている。`top` で負荷の高いプロセスを確認するか、VM の vCPU 割当を見直す。"

      - alert: HostCpuCritical
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 95
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} の CPU 使用率が {{ $value | printf \"%.1f\" }}%（飽和）"
          description: "95% 超が 10 分続いている。暴走プロセスの可能性。応答不能になる前に原因プロセスを止める。"

  - name: availability
    rules:
      # vm-dev は onboot=false で手動起動のため除外（停止検知は PveVmStopped が onboot=1 のみ対象）
      - alert: TargetDown
        expr: up{instance!="vm-dev"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} / {{ $labels.instance }} に接続できない"

      # Slack への送信が失敗している。Slack 自体に届かないため、この通知は Alertmanager の UI
      # (http://192.168.11.13:9093) と Grafana / Prometheus の Alerts 画面でのみ確認できる
      - alert: AlertmanagerNotificationsFailing
        expr: sum by (integration) (increase(alertmanager_notifications_failed_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager から {{ $labels.integration }} への通知が失敗している"
          description: "Webhook URL の失効や Slack 側の障害の可能性。`docker logs alertmanager` を確認する。"

      # AdGuard は fallback DNS を持つため、Unbound が止まっても利用者は気づかない。
      # 未キャッシュの名前を Unbound に直接引いて、再帰解決できているかを見る（vm-infra の unbound-metrics.timer）
      - alert: UnboundProbeFailing
        expr: unbound_probe_success == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} の Unbound が再帰解決に失敗している"
          description: "AdGuard の fallback DNS で名前解決は続いているが、フル再帰の方針から外れている。`docker logs unbound` を確認する。"

      - alert: UnboundProbeStale
        expr: time() - unbound_probe_last_run_timestamp_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Unbound のプローブが 5 分以上更新されていない"
          description: "unbound-metrics.timer が停止している可能性。この間 Unbound の障害を検知できない。"

      - alert: UnboundProbeMissing
        expr: absent(unbound_probe_success)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Unbound のプローブのメトリクスが存在しない"

      # 常に firing する。通知経路の死活確認（外部 Heartbeat 監視の入力にも使う）
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Alertmanager パイプラインの動作確認用（常時 firing）"
