groups:
  - name: storage
    rules:
      # INC-2026-10-22: LVM thin pool 枯渇で全 VM が io-error になった
      - alert: LvmThinPoolDataHigh
        expr: lvm_thin_pool_data_percent > 75
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "thin pool {{ $labels.vg }}/{{ $labels.pool }} の使用率が {{ $value | printf \"%.1f\" }}%"
          description: "75% 超。90% を超えると critical。VM 内で fstrim を実行し、容量の増加要因を確認する。"

      - alert: LvmThinPoolDataCritical
        expr: lvm_thin_pool_data_percent > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "thin pool {{ $labels.vg }}/{{ $labels.pool }} の使用率が {{ $value | printf \"%.1f\" }}%（枯渇間近）"
          description: "100% で全 VM が io-error になる。至急 pool 拡張または容量回収を行う。docs/operations/incidents/2026-10-22-lvm-thin-exhaustion.md 参照。"

      # 仮想ディスク合計 ÷ pool サイズ。1 を超えると、全 VM が使い切る前に pool が尽きる。
      # INC-2026-10-22 の障害時は約 1.6（現在は 1.44）。discard が効いていても、増やしすぎない歯止めにする
      - alert: LvmThinPoolOverprovisioned
        expr: lvm_thin_pool_provisioned_bytes / lvm_thin_pool_size_bytes > 1.5
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "thin pool {{ $labels.vg }}/{{ $labels.pool }} の割当比率が {{ $value | printf \"%.2f\" }}（仮想サイズ合計が pool の 1.5 倍超）"
          description: "VM ディスクを増やしすぎている。pool の拡張、ディスクの縮小、不要な VM の削除を検討する。使用率が低くても、全 VM が使い切れば枯渇する。"

      - alert: LvmThinPoolMetadataHigh
        expr: lvm_thin_pool_metadata_percent > 75
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "thin pool {{ $labels.vg }}/{{ $labels.pool }} のメタデータ使用率が {{ $value | printf \"%.1f\" }}%"

      - alert: LvmThinPoolMetadataCritical
        expr: lvm_thin_pool_metadata_percent > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "thin pool {{ $labels.vg }}/{{ $labels.pool }} のメタデータが枯渇間近（{{ $value | printf \"%.1f\" }}%）"

      - alert: PveVmIoError
        expr: pve_vm_io_error == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "VM {{ $labels.name }} ({{ $labels.vmid }}) が io-error で停止中"
          description: "ストレージ容量枯渇の可能性が高い。pool を拡張してから qm resume する。"

      # onboot=1 の VM が停止している（シャットダウン・クラッシュ・手動停止）
      - alert: PveVmStopped
        expr: pve_vm_running{onboot="1"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "VM {{ $labels.name }} ({{ $labels.vmid }}) が停止している"
          description: "onboot=1 の VM が running でない。PVE の UI または qm start で確認する。"

      - alert: PveStorageMetricsStale
        expr: time() - pve_storage_metrics_last_run_timestamp_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PVE の thin pool メトリクスが 5 分以上更新されていない"
          description: "pve-storage-metrics.timer が停止している可能性。この間 thin pool を監視できない。"

      - alert: PveStorageMetricsMissing
        expr: absent(lvm_thin_pool_data_percent)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "thin pool のメトリクスが存在しない"

      - alert: HostDiskUsageHigh
        expr: |
          100 * (1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs"}) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} の {{ $labels.mountpoint }} が {{ $value | printf \"%.1f\" }}%"

      - alert: HostDiskUsageCritical
        expr: |
          100 * (1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs"}) > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} の {{ $labels.mountpoint }} が {{ $value | printf \"%.1f\" }}%"

  - name: memory
    rules:
      # vm-code が開発中に OOM でハングした（応答不能になり、TargetDown まで気づけなかった）。
      # スワップなしの VM では MemAvailable が尽きる前に検知する。vm-dev は手動起動のため、起動中のみ評価される
      - alert: HostMemoryLow
        expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} の利用可能メモリが {{ $value | printf \"%.1f\" }}%"
          description: "10% 未満。OOM でハングする前にプロセスを確認するか、VM のメモリ割当を増やす。"

      - alert: HostMemoryCritical
        expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} の利用可能メモリが {{ $value | printf \"%.1f\" }}%（OOM 間近）"
          description: "5% 未満。応答不能になる前に、重いプロセスを止めるか VM のメモリを増やす。"

      - alert: HostOomKilled
        expr: increase(node_vmstat_oom_kill[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} で OOM killer がプロセスを終了させた"
          description: "`dmesg | grep -i oom` で対象を確認する。再発するならメモリ割当を増やす。"

  - name: cpu
    rules:
      # 全コアの平均使用率（idle 以外）。一時的なビルドや起動直後のスパイクで鳴らないよう、待ち時間を長めに取る。
      # vm-dev は手動起動のため、起動中のみ評価される
      - alert: HostCpuHigh
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} の CPU 使用率が {{ $value | printf \"%.1f\" }}%"
          description: "85% 超が 15 分続いている。`top` で負荷の高いプロセスを確認するか、VM の vCPU 割当を見直す。"

      - alert: HostCpuCritical
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 95
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} の CPU 使用率が {{ $value | printf \"%.1f\" }}%（飽和）"
          description: "95% 超が 10 分続いている。暴走プロセスの可能性。応答不能になる前に原因プロセスを止める。"

  - name: availability
    rules:
      # vm-dev は onboot=false で手動起動のため除外（停止検知は PveVmStopped が onboot=1 のみ対象）
      # homeassistant（センサーの値の取得）も除外する。VM の停止ではないのに critical になり、
      # 同じ host（vm-apps）の外形監視を抑制してしまうため。取得の失敗は RoomSensorMissing が担当する
      # adguard（AdGuard の統計の exporter）も同じ理由で除外する。失敗は AdGuardExporterFailing が担当する
      # omada（Omada の exporter）も同じ理由で除外する。失敗は OmadaExporterFailing が担当する
      - alert: TargetDown
        expr: up{instance!="vm-dev",job!~"homeassistant|adguard|omada"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} / {{ $labels.instance }} に接続できない"

      # Slack への送信が失敗している。Slack 自体に届かないため、この通知は Alertmanager の UI
      # (http://10.77.20.11:9093) と Grafana / Prometheus の Alerts 画面でのみ確認できる
      - alert: AlertmanagerNotificationsFailing
        expr: sum by (integration) (increase(alertmanager_notifications_failed_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager から {{ $labels.integration }} への通知が失敗している"
          description: "Webhook URL の失効や Slack 側の障害の可能性。`docker logs alertmanager` を確認する。"

      # AdGuard は fallback DNS を持つため、Unbound が止まっても利用者は気づかない。
      # 未キャッシュの名前を Unbound に直接引いて、再帰解決できているかを見る（vm-infra の unbound-metrics.timer）
      - alert: UnboundProbeFailing
        expr: unbound_probe_success == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} の Unbound が再帰解決に失敗している"
          description: "AdGuard の fallback DNS で名前解決は続いているが、フル再帰の方針から外れている。`docker logs unbound` を確認する。"

      - alert: UnboundProbeStale
        expr: time() - unbound_probe_last_run_timestamp_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Unbound のプローブが 5 分以上更新されていない"
          description: "unbound-metrics.timer が停止している可能性。この間 Unbound の障害を検知できない。"

      - alert: UnboundProbeMissing
        expr: absent(unbound_probe_success)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Unbound のプローブのメトリクスが存在しない"

      # 常に firing する。通知経路の死活確認（外部 Heartbeat 監視の入力にも使う）
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Alertmanager パイプラインの動作確認用（常時 firing）"

  - name: blackbox
    rules:
      # 外形監視。node_exporter が生きていても、サービスが使えない障害（Caddy の証明書切れ、
      # バックエンドの 5xx、DNS の応答なし）を、利用者と同じ経路で検知する
      - alert: ServiceProbeFailed
        expr: probe_success{job="blackbox_http"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} が使えない（外形監視）"
          description: "Caddy 経由の HTTPS アクセスに失敗している。`curl -v` で原因（DNS・TLS・バックエンドの応答）を切り分ける。"

      - alert: DnsProbeFailed
        expr: probe_success{job="blackbox_dns"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AdGuard の名前解決に失敗している（{{ $labels.service }}）"
          description: "dns-lab は内部ゾーン（CoreDNS）、dns-external は外部の名前（Unbound）の解決に失敗している。`dig @10.77.20.10` で確認する。この間、HTTPS の外形監視は通知を抑制する。"

      - alert: TlsCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox_http"} - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} の証明書の残りが {{ $value | printf \"%.0f\" }} 日"
          description: "Let's Encrypt は残り 30 日で更新されるはずなので、自動更新が失敗している。`docker logs caddy` を確認する（reverse-proxy-tls.md）。"

      - alert: TlsCertExpiryCritical
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox_http"} - time()) / 86400 < 3
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} の証明書の残りが {{ $value | printf \"%.1f\" }} 日"
          description: "まもなく失効する。至急、Caddy の証明書更新を確認する。"

      - alert: BlackboxProbeMissing
        expr: absent(probe_success{job="blackbox_http"}) or absent(probe_success{job="blackbox_dns"}) or absent(probe_success{job="blackbox_icmp"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "外形監視のメトリクスが存在しない"
          description: "blackbox-exporter の停止の可能性（監視の盲点）。`docker logs blackbox-exporter` を確認する。"

  - name: internet-connectivity
    rules:
      # ルーターには届くが、1.1.1.1 と 8.8.8.8 の両方に届かない = 回線断（建物側・ISP・ルーターの WAN 側）。
      # 片方だけ失敗するなら、その宛先側の問題とみなして発報しない。
      # 回線が落ちている間は Slack に届かない。Healthchecks.io の DOWN（外部 Heartbeat）が先に届く。
      # Slack の通知は、回線が戻ってから届く
      - alert: InternetDown
        expr: |
          probe_success{service="internet-cloudflare"} == 0
          and on() probe_success{service="internet-google"} == 0
          and on() probe_success{service="gateway"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "インターネットに届かない（1.1.1.1 と 8.8.8.8 の両方に ping が通らない）"
          description: "ルーター（10.77.20.1）には届いている。Grafana「Internet Connectivity」の「建物の共用ルーター」が通っていれば ISP・建物の先、通っていなければ建物側（共用ルーター・ONU）を疑う。ルーターの WAN 側の再起動も試す。"

      - alert: GatewayUnreachable
        expr: probe_success{service="gateway"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ルーター（10.77.20.1）に ping が通らない"
          description: "vm-monitoring からルーターまで届かない。ルーターの停止、LAN の断、PVE の NIC 停止（INC-2026-10-25）を疑う。"

      # 1.1.1.1 と 8.8.8.8 の両方で 10 分間のロスが 10% 超のときだけ通知する（片方だけなら宛先側の問題）。
      # ルーター自身に届かない間（LAN 側の障害・作業中）は評価しない。その間は GatewayUnreachable が担当する
      - alert: InternetPacketLoss
        expr: |
          (1 - avg_over_time(probe_success{service="internet-cloudflare"}[10m]) > 0.1)
          and on() (1 - avg_over_time(probe_success{service="internet-google"}[10m]) > 0.1)
          and on() avg_over_time(probe_success{service="gateway"}[10m]) > 0.95
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "インターネットへのパケットロスが {{ $value | humanizePercentage }}（1.1.1.1 宛て、10 分間。8.8.8.8 も 10% 超）"
          description: "ルーターには届いているのに、1.1.1.1 と 8.8.8.8 の両方への ping が落ちている。建物側のネットワークの混雑や ISP 側の問題。Grafana「Internet Connectivity」で遅延と合わせて見る。"

      # 平常（7 日間の中央値）の 3 倍かつ 100ms 超が 15 分続いたら通知する（体感できる遅さだけ通知する）。
      # 平常値が溜まる前（測定 2 日分 = 5760 回未満）は評価しない
      - alert: InternetLatencyHigh
        expr: |
          avg_over_time(probe_icmp_duration_seconds{phase="rtt",service="internet-cloudflare"}[10m]) > 0.1
          and
          avg_over_time(probe_icmp_duration_seconds{phase="rtt",service="internet-cloudflare"}[10m])
            > 3 * quantile_over_time(0.5, probe_icmp_duration_seconds{phase="rtt",service="internet-cloudflare"}[7d])
          and count_over_time(probe_icmp_duration_seconds{phase="rtt",service="internet-cloudflare"}[7d]) > 5000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "インターネットへの ping の遅延が平常の 3 倍超（{{ $value | humanizeDuration }}）"
          description: "1.1.1.1 への RTT が、7 日間の中央値の 3 倍かつ 100ms を超えている。建物側の混雑を疑う。「建物の共用ルーター」の遅延も高ければ建物内、低ければその先。"

  # 室内の温度・湿度（SwitchBot Hub 2 → SwitchBot Cloud → Home Assistant → Prometheus）
  - name: room-environment
    rules:
      # 冬の乾燥。換気や加湿器の一時的な変化で鳴らないよう、1 時間続いたら通知する
      - alert: RoomHumidityLow
        expr: homeassistant_sensor_humidity_percent{entity="sensor.switchbot_hub_2_humidity"} < 35
        for: 1h
        # 35%・70% の前後を行き来して、発報と解消が何度も届かないよう、解消を 30 分待つ
        keep_firing_for: 30m
        labels:
          severity: warning
          channel: environment   # 室内環境用チャンネルに送る（alertmanager.yml）
        annotations:
          summary: "室内の湿度が {{ $value | printf \"%.0f\" }}%（35% 未満が 1 時間続いている）"
          description: "乾燥している。加湿器を使う。Grafana「Room Environment」で推移を見る。"

      # 夏の結露・カビ。入浴や料理の一時的な上昇で鳴らないよう、1 時間続いたら通知する
      - alert: RoomHumidityHigh
        expr: homeassistant_sensor_humidity_percent{entity="sensor.switchbot_hub_2_humidity"} > 70
        for: 1h
        # 35%・70% の前後を行き来して、発報と解消が何度も届かないよう、解消を 30 分待つ
        keep_firing_for: 30m
        labels:
          severity: warning
          channel: environment   # 室内環境用チャンネルに送る（alertmanager.yml）
        annotations:
          summary: "室内の湿度が {{ $value | printf \"%.0f\" }}%（70% 超が 1 時間続いている）"
          description: "結露やカビの原因になる。除湿・換気する。Grafana「Room Environment」で推移を見る。"

      # HA は動いているが、センサーの値を取れていない（SwitchBot Cloud の障害、トークンの失効、Hub の電源断）
      - alert: RoomSensorUnavailable
        expr: homeassistant_entity_available{entity=~"sensor.switchbot_hub_2_(temperature|humidity)"} == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Home Assistant で {{ $labels.entity }} が利用できない"
          description: "SwitchBot Cloud の統合を HA の画面（設定 > デバイスとサービス）で確認する。Hub 2 の電源と Wi-Fi も確認する。この間、湿度のアラートは鳴らない。"

      # Prometheus に値が届いていない（HA の停止、/api/prometheus のトークン失効、UFW、設定の誤り）
      - alert: RoomSensorMissing
        expr: absent(homeassistant_sensor_humidity_percent{entity="sensor.switchbot_hub_2_humidity"})
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "室内の湿度のメトリクスが Prometheus に無い"
          description: "Prometheus の Targets で job=homeassistant の状態を確認する（401 ならトークン、接続できなければ HA の停止か UFW）。この間、湿度のアラートは鳴らない。"

  # AdGuard Home の統計（adguard-exporter）。統計そのものには通知を付けない（実測を見てから決める）。
  # 統計が取れていないことだけを知らせる
  - name: adguard
    rules:
      # exporter の停止、または AdGuard の API を読めない（認証の失敗、Caddy・AdGuard の停止）。
      # DNS が応答しない間は DnsProbeFailed が先に鳴るので、alertmanager.yml で抑制する
      - alert: AdGuardExporterFailing
        expr: up{job="adguard"} == 0 or increase(adguard_scrape_errors_total[10m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "AdGuard Home の統計が取れていない"
          description: "`docker logs adguard-exporter` を確認する（401 なら exporter ユーザーのパスワード、接続できなければ Caddy か AdGuard）。この間、Grafana の AdGuard Home のダッシュボードは更新されない。"

  # Omada が管理する機器・ポート・クライアントの状態（omada-exporter）。機器の状態や使用量には、
  # まだ通知を付けない（実測を見てから決める）。状態が取れていないことだけを知らせる
  - name: omada
    rules:
      # exporter の停止、またはコントローラーの API を読めない（認証の失敗、Caddy・コントローラーの停止）。
      # 起動した直後の 1 回目は、全 collector が 0 になるので、for で吸収する。
      # コントローラーの画面が落ちている間は ServiceProbeFailed（service="omada"）が、
      # DNS が応答しない間は DnsProbeFailed が先に鳴るので、alertmanager.yml で抑制する
      - alert: OmadaExporterFailing
        expr: up{job="omada"} == 0 or min by (job) (omada_collector_last_scrape_completed) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Omada の機器・クライアントの状態が取れていない"
          description: "`docker logs omada-exporter` を確認する（-44106 なら Open API の Client ID・シークレット、ログインの失敗なら exporter ユーザーのパスワード、接続できなければ Caddy かコントローラー）。この間、Grafana の Omada のダッシュボードは更新されない。"
