global:
  resolve_timeout: 5m

# 重要度ごとに通知先と再通知の間隔を一律に決める（アラート名では分けない）。
#   critical      : slack-critical（critical 用チャンネル）、1 時間毎
#   それ以外全部  : slack-warning（warning 用チャンネル）、24 時間毎
# 慢性的な warning が何度再通知されても、critical のチャンネルは埋まらない
route:
  receiver: slack-warning
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 24h
  routes:
    # Watchdog は Slack には送らず、外部の Heartbeat（Healthchecks.io）へ定期送信する。途絶えたら外部から通知される（ADR-0010）
    - matchers:
        - alertname = "Watchdog"
      receiver: heartbeat
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 5m
    - matchers:
        - severity = "critical"
      receiver: slack-critical
      repeat_interval: 1h

# 上流の障害があるとき、下流の通知を抑える
inhibit_rules:
  # VM が落ちている（TargetDown）間は、その VM 上のサービスの外形監視を通知しない
  - source_matchers:
      - alertname = "TargetDown"
    target_matchers:
      - alertname = "ServiceProbeFailed"
    equal: ["host"]
  # DNS が応答しない間は、名前解決に依存する HTTPS の外形監視を通知しない
  - source_matchers:
      - alertname = "DnsProbeFailed"
    target_matchers:
      - alertname = "ServiceProbeFailed"
  # 回線断の間は、外の名前解決・遅延・パケットロスが必ず失敗する。回線断の 1 通にまとめる
  - source_matchers:
      - alertname = "InternetDown"
    target_matchers:
      - alertname =~ "InternetPacketLoss|InternetLatencyHigh"
  - source_matchers:
      - alertname = "InternetDown"
    target_matchers:
      - alertname = "DnsProbeFailed"
      - service = "dns-external"

receivers:
  - name: "null"

  - name: heartbeat
    webhook_configs:
      # ping URL は Ansible が SOPS から /etc/alertmanager/heartbeat_ping_url に配置する
      - url_file: /etc/alertmanager/heartbeat_ping_url
        send_resolved: false

  - name: slack-critical
    slack_configs:
      # Webhook URL は Ansible が SOPS から /etc/alertmanager/slack_webhook_url に配置する（critical 用チャンネル）
      - &slack_config
        api_url_file: /etc/alertmanager/slack_webhook_url
        send_resolved: true
        color: '{{ if eq .Status "resolved" }}good{{ else if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}'
        title: '{{ if eq .Status "resolved" }}[RESOLVED]{{ else }}[{{ .CommonLabels.severity | toUpper }}]{{ end }} {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts }}• {{ .Annotations.summary }}
          {{ if .Annotations.description }}  {{ .Annotations.description }}
          {{ end }}{{ end }}

  - name: slack-warning
    slack_configs:
      # 見た目は slack-critical と同じ。送り先（warning 用チャンネルの Webhook URL）だけ変える
      - <<: *slack_config
        api_url_file: /etc/alertmanager/slack_webhook_url_warning
