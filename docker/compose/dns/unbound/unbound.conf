server:
    interface: 127.0.0.1@5335
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    root-hints: "/opt/unbound/etc/unbound/root.hints"

    # セキュリティ設定
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: yes
    prefetch: yes

    # 障害調査用。ログは stdout に出て、docker のログ上限で回る
    verbosity: 1
    log-servfail: yes

    # 上流が応答しないとき、期限切れのキャッシュ（最大 1 時間）を返す
    serve-expired: yes
    serve-expired-ttl: 3600

    # アクセス制御（localhost のみ）
    access-control: 127.0.0.0/8 allow
