# INC-2026-10-22: コンテナログがディスクを圧迫しないよう上限を設ける
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=home.lab.kanare.dev
    dns:
      - 192.168.11.11
    volumes:
      - ./config:/app/config
      - ./icons:/app/public/icons
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks: {}
