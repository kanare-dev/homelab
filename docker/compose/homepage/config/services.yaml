- Infrastructure:
    - Proxmox VE:
        href: https://pve.lab.kanare.dev
        description: Hypervisor
        icon: proxmox.png
        siteMonitor: https://pve.lab.kanare.dev
        widget:
          type: proxmox
          url: https://192.168.11.10:8006
          username: homepage@pve!homepage-token
          password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"
          node: pve

# 手動起動の vm-dev は含めない（停止中は値が取れないため）
- Hosts:
    - pve:
        description: Proxmox host (192.168.11.10)
        icon: proxmox.png
        widget:
          type: prometheusmetric
          url: https://prometheus.lab.kanare.dev
          metrics:
            - label: CPU
              query: 100 - avg(rate(node_cpu_seconds_total{instance="pve",mode="idle"}[5m])) * 100
              format:
                type: number
                options:
                  maximumFractionDigits: 0
                suffix: "%"
            - label: Mem
              query: 100 * (1 - node_memory_MemAvailable_bytes{instance="pve"} / node_memory_MemTotal_bytes{instance="pve"})
              format:
                type: number
                options:
                  maximumFractionDigits: 0
                suffix: "%"
            - label: Disk
              query: 100 * (1 - node_filesystem_avail_bytes{instance="pve",mountpoint="/"} / node_filesystem_size_bytes{instance="pve",mountpoint="/"})
              format:
                type: number
                options:
                  maximumFractionDigits: 0
                suffix: "%"
