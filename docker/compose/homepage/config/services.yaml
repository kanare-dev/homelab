- Infrastructure:
    - Proxmox VE:
        href: https://pve.lab.kanare.dev
        description: Hypervisor
        icon: proxmox.png
        siteMonitor: https://pve.lab.kanare.dev
        widget:
          type: proxmox
          url: https://192.168.11.10:8006
          username: homepage@pve!homepage-token
          password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"
          node: pve

- Network:
    - Router:
        href: https://router.lab.kanare.dev
        description: Buffalo WSR-1800AX4P
        icon: router.png
        siteMonitor: https://router.lab.kanare.dev
    - AdGuard Home:
        href: https://adguard.lab.kanare.dev
        description: DNS Filtering
        icon: adguard-home.png
        siteMonitor: https://adguard.lab.kanare.dev
        widget:
          type: adguard
          url: http://192.168.11.11:3000
          username: kanare
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"

- Monitoring:
    - Grafana:
        href: https://grafana.lab.kanare.dev
        description: Metrics Dashboards
        icon: grafana.png
        siteMonitor: https://grafana.lab.kanare.dev
    - Prometheus:
        href: https://prometheus.lab.kanare.dev
        description: Metrics Scraper
        icon: /icons/prometheus.svg
        siteMonitor: https://prometheus.lab.kanare.dev
        widget:
          # 標準の prometheus ウィジェットは手動起動の vm-dev を down に数えるため、TargetDown と同じ条件で数える
          type: prometheusmetric
          url: https://prometheus.lab.kanare.dev
          metrics:
            - label: Up
              query: count(up == 1) or vector(0)
              format:
                type: number
            - label: Down
              query: count(up{instance!="vm-dev"} == 0) or vector(0)
              format:
                type: number
    - Alertmanager:
        href: https://alertmanager.lab.kanare.dev
        description: Alert Routing
        icon: /icons/alertmanager.svg
        siteMonitor: https://alertmanager.lab.kanare.dev
        widget:
          # Alertmanager 専用のウィジェットはないため、Prometheus の ALERTS で発報中の件数を出す（Watchdog は常時発報なので除く）
          type: prometheusmetric
          url: https://prometheus.lab.kanare.dev
          metrics:
            - label: Firing
              query: count(ALERTS{alertstate="firing",alertname!="Watchdog"}) or vector(0)
              format:
                type: number
            - label: Pending
              query: count(ALERTS{alertstate="pending"}) or vector(0)
              format:
                type: number

    - Healthchecks.io:
        href: https://healthchecks.io
        description: External Heartbeat
        icon: healthchecks.png
        widget:
          type: healthchecks
          url: https://healthchecks.io
          key: "{{HOMEPAGE_VAR_HEALTHCHECKS_API_KEY}}"

- Development:
    - code-server:
        href: https://code.lab.kanare.dev
        description: VS Code in Browser
        icon: code-server.png
        siteMonitor: https://code.lab.kanare.dev
    - CloudCLI:
        href: https://cloudcli.lab.kanare.dev
        description: Claude Code UI
        icon: claude-ai.png
        siteMonitor: https://cloudcli.lab.kanare.dev

- Home:
    - Home Assistant:
        href: https://ha.lab.kanare.dev
        description: Smart Home
        icon: home-assistant.png
        siteMonitor: https://ha.lab.kanare.dev
        widget:
          type: homeassistant
          url: https://ha.lab.kanare.dev
          key: "{{HOMEPAGE_VAR_HA_TOKEN}}"
          custom:
            - state: sensor.switchbot_hub_2_temperature
              label: 温度
            - state: sensor.switchbot_hub_2_humidity
              label: 湿度

- Automation:
    - n8n:
        href: https://n8n.lab.kanare.dev
        description: Workflow Automation
        icon: n8n.png
        siteMonitor: https://n8n.lab.kanare.dev
