# Loads default set of integrations. Do not remove.
default_config:

# HTTP（リバースプロキシの信頼設定）は YAML に書かない。2026.10 以降は初回だけ YAML から取り込まれ、
# 以後は .storage/http だけが使われる。Caddy（vm-infra）を信頼する設定は docker/compose/homeassistant/storage/http にある

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# センサーの値を Prometheus（vm-monitoring）に出す。/api/prometheus は長期アクセストークン（prometheus）で認証する。
# 出すのは、監視に使うエンティティだけに絞る（docs/architecture/lld/platform/monitoring.md の「室内の温度・湿度」）
prometheus:
  filter:
    include_entities:
      - sensor.switchbot_hub_2_temperature
      - sensor.switchbot_hub_2_humidity

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
