---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ hostname | default(inventory_hostname) }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

# INC-2026-10-22: journal の無制限な増加を防ぐ（vm-infra は 1.1G まで増えていた）
- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Limit journald disk usage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-size-limit.conf
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse={{ journald_system_max_use }}
      MaxRetentionSec={{ journald_max_retention }}
  notify: Restart systemd-journald

# INC-2026-10-22: discard 有効な仮想ディスクの未使用ブロックを thin pool に返す
- name: Enable weekly fstrim
  ansible.builtin.systemd:
    name: fstrim.timer
    state: started
    enabled: true

- name: Set timezone to Asia/Tokyo
  community.general.timezone:
    name: Asia/Tokyo

- name: Configure NTP servers
  ansible.builtin.template:
    src: timesyncd.conf.j2
    dest: /etc/systemd/timesyncd.conf
    mode: "0644"
  notify: Restart systemd-timesyncd
  when: ntp_servers is defined

# ADR-0013: コンソール（Proxmox noVNC）と sudo -v 用。SSH は鍵認証のみのまま（下のタスク）
- name: Set console password for the login user
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    password: "{{ vm_user_password_hash }}"
  no_log: true

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication {{ ssh_password_authentication }}"
  notify: Restart sshd

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin {{ ssh_permit_root_login }}"
  notify: Restart sshd

- name: Disable SSH last login banner (the custom MOTD does not show login history either)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PrintLastLog"
    line: "PrintLastLog no"
  notify: Restart sshd

- name: Enable and configure UFW defaults
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming

- name: Allow UFW ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ item.from | default('any') }}"
  loop: "{{ ufw_allowed_ports | default([]) }}"

# 許可元を絞ったあとに、旧来の「どこからでも許可」ルールを消す（ufw は定義にないルールを消さない）
- name: Remove UFW rules that are no longer wanted
  community.general.ufw:
    rule: allow
    delete: true
    port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ item.from | default('any') }}"
  loop: "{{ ufw_removed_ports | default([]) }}"

- name: Always allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Prefer IPv4 over IPv6 for outbound connections
  ansible.builtin.lineinfile:
    path: /etc/gai.conf
    regexp: '^#?precedence\s+::ffff:0:0/96'
    line: "precedence ::ffff:0:0/96  100"
    create: true
    mode: "0644"

- name: Install figlet for MOTD banner
  ansible.builtin.apt:
    name: figlet
    state: present

# フォントは配布元（xero/figlet-fonts）にライセンスの記載が無く、作者も不明（"Font Author: ?"）なので、
# リポジトリには置かない。コミットとチェックサムを固定して取得する。
# 更新するときは、新しいコミットの URL と sha256 を、docs/services/platform/motd.md の手順で確かめてから差し替える。
- name: Download ansi-shadow figlet font (pinned)
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/xero/figlet-fonts/fbf3b68dd0fcd1e63c0f04d3c79eea2743bb377c/ANSI%20Shadow.flf
    dest: /usr/share/figlet/ansi-shadow.flf
    checksum: sha256:5b3141fa14163c90ff199d169331333875df557fa463b9fb05b85fee6eca6dc1
    mode: "0644"

- name: Deploy custom MOTD script
  ansible.builtin.copy:
    src: motd.sh
    dest: /etc/update-motd.d/99-custom
    mode: "0755"
    owner: root
    group: root

- name: Find default MOTD scripts
  ansible.builtin.find:
    paths: /etc/update-motd.d
    file_type: any
    excludes: "99-custom"
  register: common_default_motd_scripts

# 標準の MOTD スクリプトは、実行権限を外して止める。
# 通常のファイルは、そのまま権限を外す（リンク先は触らない）。
- name: Disable default MOTD scripts (regular files)
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0644"
    follow: false
  loop: "{{ common_default_motd_scripts.files | rejectattr('islnk') | list }}"
  loop_control:
    label: "{{ item.path }}"

# シンボリックリンク（例: 50-landscape-sysinfo）は、リンク先がパッケージのファイル。
# リンク先を chmod するだけだと、パッケージの更新で実行権限が戻るので、dpkg-statoverride に記録する。
- name: Resolve symlinked default MOTD scripts
  ansible.builtin.command: readlink -f {{ item.path }}
  loop: "{{ common_default_motd_scripts.files | selectattr('islnk') | list }}"
  loop_control:
    label: "{{ item.path }}"
  register: common_motd_symlink_targets
  changed_when: false
  check_mode: false

- name: List existing dpkg-statoverride entries for the symlink targets
  ansible.builtin.command: dpkg-statoverride --list {{ item.stdout }}
  loop: "{{ common_motd_symlink_targets.results }}"
  loop_control:
    label: "{{ item.stdout }}"
  register: common_motd_statoverride
  changed_when: false
  failed_when: false
  check_mode: false

- name: Keep the symlink targets non-executable across package updates
  ansible.builtin.command: dpkg-statoverride --update --add root root 0644 {{ item.item.stdout }}
  loop: "{{ common_motd_statoverride.results }}"
  loop_control:
    label: "{{ item.item.stdout }}"
  when: item.stdout | length == 0
  changed_when: true

- name: Disable motd-news service and timer
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - motd-news.service
    - motd-news.timer
  register: common_motd_news
  # ユニットが存在しない環境では「見つからない」だけを許容する
  failed_when: common_motd_news is failed and 'Could not find' not in (common_motd_news.msg | default(''))

# MOTD の更新数は、パッケージ一覧が古いと古い値になる。標準は 1 日 1 回（実質）の更新なので、6 時間ごとにする
- name: Create apt-daily.timer drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/apt-daily.timer.d
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Run apt-daily.timer every 6 hours
  ansible.builtin.copy:
    dest: /etc/systemd/system/apt-daily.timer.d/override.conf
    content: |
      [Timer]
      OnCalendar=
      OnCalendar=*-*-* 00,06,12,18:00
      RandomizedDelaySec=30min
    mode: "0644"
    owner: root
    group: root
  notify: Restart apt-daily.timer

- name: Update apt package lists on every apt-daily run
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52apt-update-always
    content: |
      // apt-daily.timer の実行ごとにパッケージ一覧を更新する（MOTD の更新数を新しく保つ）
      APT::Periodic::Update-Package-Lists "always";
    mode: "0644"
    owner: root
    group: root
