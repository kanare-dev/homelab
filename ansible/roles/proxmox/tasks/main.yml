---
# サブスクリプション警告の除去（INC-2026-10-22-b）
# 判定式を `false` に置換するだけにする。置換後は一致しないので冪等で、構文を壊さない。
# パッケージ更新で元に戻っても、再実行すれば当て直せる。一致しなければ何もしない（警告が出るだけ）
- name: Remove no-subscription popup
  ansible.builtin.replace:
    path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
    regexp: "res\\.data\\.status\\.toLowerCase\\(\\) !== 'active'"
    replace: "false"
  notify: Restart pveproxy

# INC-2026-10-25: e1000e (Intel I219) が TSO 起因の Hardware Unit Hang で送信停止し、ホストと全 VM が LAN から消えた。
# オフロードを無効にして再発を防ぐ。再起動後も効くよう interfaces に書き、今の実行中の NIC にも直接適用する（ifreload は通信が途切れうるので使わない）
- name: Disable NIC offloads on nic0 (persistent)
  ansible.builtin.blockinfile:
    path: /etc/network/interfaces
    insertafter: '^iface nic0 inet manual$'
    marker: "    # {mark} ANSIBLE MANAGED: e1000e hang workaround (INC-2026-10-25)"
    block: "    post-up ethtool -K nic0 tso off gso off gro off"

- name: Disable NIC offloads on nic0 (running)
  ansible.builtin.command: ethtool -K nic0 tso off gso off gro off
  changed_when: false

# INC-2026-10-22: thin pool 使用率と VM の io-error を Prometheus から見えるようにする
- name: Install storage metrics collector
  ansible.builtin.copy:
    src: pve-storage-metrics.sh
    dest: /usr/local/bin/pve-storage-metrics.sh
    owner: root
    group: root
    mode: "0755"

- name: Create storage metrics systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/pve-storage-metrics.service
    mode: "0644"
    content: |
      [Unit]
      Description=Export LVM thin pool and VM io-error metrics for node_exporter

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/pve-storage-metrics.sh {{ node_exporter_textfile_dir }}

- name: Create storage metrics systemd timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/pve-storage-metrics.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Run pve-storage-metrics every minute

      [Timer]
      OnBootSec=30s
      OnUnitActiveSec=60s
      AccuracySec=5s

      [Install]
      WantedBy=timers.target

- name: Enable storage metrics timer
  ansible.builtin.systemd:
    name: pve-storage-metrics.timer
    state: started
    enabled: true
    daemon_reload: true
