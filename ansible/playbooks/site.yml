---
# 全 VM の一括セットアップ
- name: Setup all VMs
  hosts: infra:monitoring:apps:dev:code
  roles:
    - common
    - docker
    - node_exporter

- name: Setup Proxmox host
  ansible.builtin.import_playbook: proxmox.yml
- name: Setup infra VM
  ansible.builtin.import_playbook: infra.yml
- name: Setup monitoring VM
  ansible.builtin.import_playbook: monitoring.yml
- name: Setup apps VM
  ansible.builtin.import_playbook: apps.yml
- name: Setup code VM
  ansible.builtin.import_playbook: code.yml
