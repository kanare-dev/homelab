---
- name: Setup infra VM (DNS + Reverse Proxy + Tailscale)
  hosts: infra
  roles:
    - node_exporter
    - coredns
    - dns_metrics
    - tailscale_usage_audit
  tasks:
    - name: Create reverse-proxy directory
      ansible.builtin.file:
        path: /opt/reverse-proxy
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"

    - name: Copy Dockerfile
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/reverse-proxy/Dockerfile"
        dest: /opt/reverse-proxy/Dockerfile
        mode: "0644"

    - name: Copy docker-compose.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/reverse-proxy/docker-compose.yml"
        dest: /opt/reverse-proxy/docker-compose.yml
        mode: "0644"
      tags: [logging]

    - name: Copy Caddyfile
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/reverse-proxy/Caddyfile"
        dest: /opt/reverse-proxy/Caddyfile
        mode: "0644"
      notify: Restart caddy

    - name: Deploy .env with Cloudflare API token
      ansible.builtin.template:
        src: reverse-proxy.env.j2
        dest: /opt/reverse-proxy/.env
        owner: "{{ ansible_user }}"
        mode: "0600"
      notify: Restart caddy

    - name: Build and start reverse-proxy stack
      community.docker.docker_compose_v2:
        project_src: /opt/reverse-proxy
        build: policy
        state: present
      tags: [logging]

    # --- DNS (AdGuard Home + Unbound) ---
    - name: Create dns directory
      ansible.builtin.file:
        path: /opt/dns
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"

    - name: Copy dns docker-compose.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/dns/docker-compose.yml"
        dest: /opt/dns/docker-compose.yml
        mode: "0644"
      tags: [logging]

    - name: Create unbound config directory
      ansible.builtin.file:
        path: /opt/dns/unbound
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"

    - name: Copy unbound config
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/dns/unbound/unbound.conf"
        dest: /opt/dns/unbound/unbound.conf
        mode: "0644"
      notify: Restart dns stack

    - name: Copy root hints
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/dns/unbound/root.hints"
        dest: /opt/dns/unbound/root.hints
        mode: "0644"

    - name: Create adguard directories
      ansible.builtin.file:
        path: "/opt/dns/adguard/{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"
      loop:
        - work
        - conf

    # AdGuard の設定は、テンプレートが正（ADR-0040）。画面で変えた設定は、次に流すと上書きされる。
    # bcrypt のハッシュは作るたびに値が変わるので、ホストにある今のハッシュが SOPS のパスワードと
    # 合えば使い続け、合わないとき（新しいホスト、パスワードの変更）だけ作り直す。読むだけのタスク
    - name: Compute AdGuard password hashes
      ansible.builtin.shell:
        cmd: |
          python3 - << 'PYEOF'
          import bcrypt, json, os, yaml

          config_path = '/opt/dns/adguard/conf/AdGuardHome.yaml'
          current = {}
          if os.path.exists(config_path):
              with open(config_path) as f:
                  config = yaml.safe_load(f) or {}
              current = {u.get('name'): u.get('password', '') for u in config.get('users') or []}

          result = {}
          for name, env in (('kanare', 'ADGUARD_ADMIN_PASSWORD'), ('exporter', 'ADGUARD_EXPORTER_PASSWORD')):
              password = os.environ[env].encode()
              hashed = current.get(name, '')
              if not (hashed and bcrypt.checkpw(password, hashed.encode())):
                  hashed = bcrypt.hashpw(password, bcrypt.gensalt(rounds=10)).decode()
              result[name] = hashed
          print(json.dumps(result))
          PYEOF
      environment:
        ADGUARD_ADMIN_PASSWORD: "{{ adguard_admin_password }}"
        ADGUARD_EXPORTER_PASSWORD: "{{ adguard_exporter_password }}"
      register: adguard_password_hashes_raw
      changed_when: false
      check_mode: false  # 読むだけなので、check モードでも実行して、テンプレートの差分を出せるようにする
      no_log: true

    - name: Deploy AdGuard config
      ansible.builtin.template:
        src: templates/AdGuardHome.yaml.j2
        dest: /opt/dns/adguard/conf/AdGuardHome.yaml
        owner: root
        group: root
        mode: "0600"
      vars:
        adguard_password_hashes: "{{ adguard_password_hashes_raw.stdout | from_json }}"
      diff: false  # パスワードのハッシュを差分に出さない
      notify: Restart dns stack

    - name: Deploy dns stack
      community.docker.docker_compose_v2:
        project_src: /opt/dns
        state: present
      tags: [logging]

    # --- Tailscale ---
    - name: Check if Tailscale is already installed
      ansible.builtin.stat:
        path: /usr/bin/tailscale
      register: tailscale_binary

    - name: Download Tailscale install script
      ansible.builtin.get_url:
        url: https://tailscale.com/install.sh
        dest: /tmp/tailscale-install.sh
        mode: "0755"
      when: tailscale_binary is not defined or not tailscale_binary.stat.exists

    - name: Install Tailscale
      ansible.builtin.command: sh /tmp/tailscale-install.sh
      args:
        creates: /usr/bin/tailscale

    - name: Enable IPv4 forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_file: /etc/sysctl.d/99-tailscale.conf
        reload: true

    - name: Enable IPv6 forwarding
      ansible.posix.sysctl:
        name: net.ipv6.conf.all.forwarding
        value: "1"
        sysctl_file: /etc/sysctl.d/99-tailscale.conf
        reload: true

    - name: Configure Tailscale as subnet router
      ansible.builtin.command: >-
        tailscale up
        --authkey={{ tailscale_authkey }}
        --advertise-routes=10.77.20.0/24,10.77.40.0/24
        --accept-dns=false
      changed_when: true  # up は毎回実行され、変更の有無を判定できないため常に changed とする
      no_log: true  # authkey をコマンドラインごとログに出さない

  handlers:
    - name: Restart caddy
      community.docker.docker_compose_v2:
        project_src: /opt/reverse-proxy
        services:
          - caddy
        state: restarted

    - name: Restart dns stack
      community.docker.docker_compose_v2:
        project_src: /opt/dns
        state: restarted
