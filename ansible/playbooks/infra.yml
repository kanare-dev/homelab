---
- name: Setup infra VM (DNS + Reverse Proxy + Tailscale)
  hosts: infra
  roles:
    - node_exporter
    - coredns
    - dns_metrics
  tasks:
    - name: Create reverse-proxy directory
      ansible.builtin.file:
        path: /opt/reverse-proxy
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"

    - name: Copy Dockerfile
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/reverse-proxy/Dockerfile"
        dest: /opt/reverse-proxy/Dockerfile
        mode: "0644"

    - name: Copy docker-compose.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/reverse-proxy/docker-compose.yml"
        dest: /opt/reverse-proxy/docker-compose.yml
        mode: "0644"
      tags: [logging]

    - name: Copy Caddyfile
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/reverse-proxy/Caddyfile"
        dest: /opt/reverse-proxy/Caddyfile
        mode: "0644"
      notify: Restart caddy

    - name: Deploy .env with Cloudflare API token
      ansible.builtin.template:
        src: reverse-proxy.env.j2
        dest: /opt/reverse-proxy/.env
        owner: "{{ ansible_user }}"
        mode: "0600"
      notify: Restart caddy

    - name: Build and start reverse-proxy stack
      community.docker.docker_compose_v2:
        project_src: /opt/reverse-proxy
        build: policy
        state: present
      tags: [logging]

    # --- DNS (AdGuard Home + Unbound) ---
    - name: Create dns directory
      ansible.builtin.file:
        path: /opt/dns
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"

    - name: Copy dns docker-compose.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/dns/docker-compose.yml"
        dest: /opt/dns/docker-compose.yml
        mode: "0644"
      tags: [logging]

    - name: Create unbound config directory
      ansible.builtin.file:
        path: /opt/dns/unbound
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"

    - name: Copy unbound config
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/dns/unbound/unbound.conf"
        dest: /opt/dns/unbound/unbound.conf
        mode: "0644"
      notify: Restart dns stack

    - name: Copy root hints
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/dns/unbound/root.hints"
        dest: /opt/dns/unbound/root.hints
        mode: "0644"

    - name: Create adguard directories
      ansible.builtin.file:
        path: "/opt/dns/adguard/{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"
      loop:
        - work
        - conf

    - name: Deploy dns stack
      community.docker.docker_compose_v2:
        project_src: /opt/dns
        state: present
      tags: [logging]

    - name: Configure AdGuard upstream DNS
      ansible.builtin.shell:
        cmd: |
          python3 - << 'PYEOF'
          import yaml, sys, os

          config_path = '/opt/dns/adguard/conf/AdGuardHome.yaml'
          if not os.path.exists(config_path):
              sys.exit(0)

          with open(config_path, 'r') as f:
              config = yaml.safe_load(f)

          desired = [
              '[/lab.kanare.dev/]127.0.0.1:5353',
              '127.0.0.1:5335',
          ]
          if config.get('dns', {}).get('upstream_dns') == desired:
              sys.exit(0)

          config.setdefault('dns', {})['upstream_dns'] = desired
          with open(config_path, 'w') as f:
              yaml.dump(config, f, default_flow_style=False, allow_unicode=True)
          print('changed')
          PYEOF
      register: adguard_upstream
      changed_when: "'changed' in adguard_upstream.stdout"
      notify: Restart dns stack

    # Unbound が数分応答しないと、インターネット全体が引けなくなる（2026-10-22 に実際に発生）。
    # upstream が全て失敗したときだけ使う
    - name: Configure AdGuard fallback DNS
      ansible.builtin.shell:
        cmd: |
          python3 - << 'PYEOF'
          import yaml, sys, os

          config_path = '/opt/dns/adguard/conf/AdGuardHome.yaml'
          if not os.path.exists(config_path):
              sys.exit(0)

          with open(config_path, 'r') as f:
              config = yaml.safe_load(f)

          desired = ['1.1.1.1', '9.9.9.9']
          if config.get('dns', {}).get('fallback_dns') == desired:
              sys.exit(0)

          config.setdefault('dns', {})['fallback_dns'] = desired
          with open(config_path, 'w') as f:
              yaml.dump(config, f, default_flow_style=False, allow_unicode=True)
          print('changed')
          PYEOF
      register: adguard_fallback
      changed_when: "'changed' in adguard_fallback.stdout"
      notify: Restart dns stack

    # INC-2026-10-22: クエリログが 90 日保持で 1.2GB まで増えていた。7 日に短縮する
    - name: Limit AdGuard query log retention
      ansible.builtin.shell:
        cmd: |
          python3 - << 'PYEOF'
          import yaml, sys, os

          config_path = '/opt/dns/adguard/conf/AdGuardHome.yaml'
          if not os.path.exists(config_path):
              sys.exit(0)

          with open(config_path, 'r') as f:
              config = yaml.safe_load(f)

          desired = '{{ adguard_querylog_interval }}'
          if config.get('querylog', {}).get('interval') == desired:
              sys.exit(0)

          config.setdefault('querylog', {})['interval'] = desired
          with open(config_path, 'w') as f:
              yaml.dump(config, f, default_flow_style=False, allow_unicode=True)
          print('changed')
          PYEOF
      register: adguard_querylog
      changed_when: "'changed' in adguard_querylog.stdout"
      notify: Restart dns stack
      tags: [logging]

    # --- Tailscale ---
    - name: Check if Tailscale is already installed
      ansible.builtin.stat:
        path: /usr/bin/tailscale
      register: tailscale_binary

    - name: Download Tailscale install script
      ansible.builtin.get_url:
        url: https://tailscale.com/install.sh
        dest: /tmp/tailscale-install.sh
        mode: "0755"
      when: tailscale_binary is not defined or not tailscale_binary.stat.exists

    - name: Install Tailscale
      ansible.builtin.command: sh /tmp/tailscale-install.sh
      args:
        creates: /usr/bin/tailscale

    - name: Enable IPv4 forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_file: /etc/sysctl.d/99-tailscale.conf
        reload: true

    - name: Enable IPv6 forwarding
      ansible.posix.sysctl:
        name: net.ipv6.conf.all.forwarding
        value: "1"
        sysctl_file: /etc/sysctl.d/99-tailscale.conf
        reload: true

    - name: Configure Tailscale as subnet router
      ansible.builtin.command: >-
        tailscale up
        --authkey={{ tailscale_authkey }}
        --advertise-routes=192.168.11.0/24
        --accept-dns=false
      changed_when: true  # up は毎回実行され、変更の有無を判定できないため常に changed とする
      no_log: true  # authkey をコマンドラインごとログに出さない

  handlers:
    - name: Restart caddy
      community.docker.docker_compose_v2:
        project_src: /opt/reverse-proxy
        services:
          - caddy
        state: restarted

    - name: Restart dns stack
      community.docker.docker_compose_v2:
        project_src: /opt/dns
        state: restarted
