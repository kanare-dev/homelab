---
- name: Setup monitoring VM (Prometheus + Grafana)
  hosts: monitoring
  roles:
    - common
    - docker
    - node_exporter
  tasks:
    - name: Create monitoring directory
      ansible.builtin.file:
        path: /opt/monitoring
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"

    - name: Copy docker-compose.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/monitoring/docker-compose.yml"
        dest: /opt/monitoring/docker-compose.yml
        mode: "0644"

    - name: Deploy .env with Grafana admin credentials
      ansible.builtin.template:
        src: grafana.env.j2
        dest: /opt/monitoring/.env
        owner: "{{ ansible_user }}"
        mode: "0600"

    - name: Create prometheus config directory
      ansible.builtin.file:
        path: /opt/monitoring/prometheus
        state: directory
        mode: "0755"

    - name: Copy prometheus.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/monitoring/prometheus/prometheus.yml"
        dest: /opt/monitoring/prometheus/prometheus.yml
        mode: "0644"

    - name: Copy prometheus alert rules
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/monitoring/prometheus/alerts.yml"
        dest: /opt/monitoring/prometheus/alerts.yml
        mode: "0644"

    - name: Fail early if Slack webhook URL is not in secrets
      ansible.builtin.assert:
        that:
          - slack_webhook_url is defined
          - slack_webhook_url | length > 0
        fail_msg: >-
          slack_webhook_url が未設定。ansible/inventory/group_vars/monitoring/secrets.sops.yml に
          sops で追加すること（docs/operations/runbooks/slack-alerts.md参照）。

    - name: Create blackbox config directory
      ansible.builtin.file:
        path: /opt/monitoring/blackbox
        state: directory
        mode: "0755"

    - name: Copy blackbox.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/monitoring/blackbox/blackbox.yml"
        dest: /opt/monitoring/blackbox/blackbox.yml
        mode: "0644"

    - name: Create alertmanager config directory
      ansible.builtin.file:
        path: /opt/monitoring/alertmanager
        state: directory
        mode: "0755"

    - name: Copy alertmanager.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/monitoring/alertmanager/alertmanager.yml"
        dest: /opt/monitoring/alertmanager/alertmanager.yml
        mode: "0644"

    # alertmanager コンテナ (nobody) が読めるよう 0644。ホストは SSH 鍵のみ・UFW で保護
    - name: Deploy Slack webhook URL
      ansible.builtin.copy:
        content: "{{ slack_webhook_url }}"
        dest: /opt/monitoring/alertmanager/slack_webhook_url
        mode: "0644"
      no_log: true

    - name: Create grafana provisioning directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /opt/monitoring/grafana/provisioning/datasources
        - /opt/monitoring/grafana/provisioning/dashboards/json

    - name: Copy grafana datasource config
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/monitoring/grafana/provisioning/datasources/prometheus.yml"
        dest: /opt/monitoring/grafana/provisioning/datasources/prometheus.yml
        mode: "0644"

    - name: Copy grafana dashboard provisioning config
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/monitoring/grafana/provisioning/dashboards/dashboards.yml"
        dest: /opt/monitoring/grafana/provisioning/dashboards/dashboards.yml
        mode: "0644"

    - name: Copy storage (thin pool) dashboard
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/monitoring/grafana/dashboards/storage.json"
        dest: /opt/monitoring/grafana/provisioning/dashboards/json/storage.json
        mode: "0644"

    - name: Download Node Exporter Full dashboard
      ansible.builtin.get_url:
        url: https://grafana.com/api/dashboards/1860/revisions/latest/download
        dest: /opt/monitoring/grafana/provisioning/dashboards/json/node-exporter-full.json
        mode: "0644"

    - name: Download ESP32 environment dashboard
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/kanare-dev/iot-env-monitor/main/infra/grafana/dashboards/environment.json
        dest: /opt/monitoring/grafana/provisioning/dashboards/json/esp32-environment.json
        mode: "0644"

    - name: Start monitoring stack
      community.docker.docker_compose_v2:
        project_src: /opt/monitoring
        state: present

    - name: Restart monitoring services to load config changes
      community.docker.docker_compose_v2:
        project_src: /opt/monitoring
        services:
          - prometheus
          - alertmanager
          - blackbox-exporter
          - grafana
        state: restarted
