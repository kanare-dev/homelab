---
- name: Setup monitoring VM (Prometheus + Grafana)
  hosts: monitoring
  roles:
    - common
    - docker
    - node_exporter
    - ufw_docker
  tasks:
    - name: Create monitoring directory
      ansible.builtin.file:
        path: /opt/monitoring
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"

    - name: Copy docker-compose.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/monitoring/docker-compose.yml"
        dest: /opt/monitoring/docker-compose.yml
        mode: "0644"

    - name: Deploy .env with Grafana admin credentials
      ansible.builtin.template:
        src: grafana.env.j2
        dest: /opt/monitoring/.env
        owner: "{{ ansible_user }}"
        mode: "0600"

    - name: Create prometheus config directory
      ansible.builtin.file:
        path: /opt/monitoring/prometheus
        state: directory
        mode: "0755"

    - name: Copy prometheus.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/monitoring/prometheus/prometheus.yml"
        dest: /opt/monitoring/prometheus/prometheus.yml
        mode: "0644"

    - name: Copy prometheus alert rules
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/monitoring/prometheus/alerts.yml"
        dest: /opt/monitoring/prometheus/alerts.yml
        mode: "0644"

    - name: Fail early if Slack webhook URL is not in secrets
      ansible.builtin.assert:
        that:
          - slack_webhook_url is defined
          - slack_webhook_url | length > 0
        fail_msg: >-
          slack_webhook_url が未設定。ansible/inventory/group_vars/monitoring/secrets.sops.yml に
          sops で追加すること（docs/operations/runbooks/05-slack-alerts.md参照）。

    - name: Fail early if Slack webhook URL for warnings is not in secrets
      ansible.builtin.assert:
        that:
          - slack_webhook_url_warning is defined
          - slack_webhook_url_warning | length > 0
        fail_msg: >-
          slack_webhook_url_warning が未設定。ansible/inventory/group_vars/monitoring/secrets.sops.yml に
          sops で追加すること（docs/operations/runbooks/05-slack-alerts.md参照）。

    - name: Fail early if Slack webhook URL for room environment is not in secrets
      ansible.builtin.assert:
        that:
          - slack_webhook_url_environment is defined
          - slack_webhook_url_environment | length > 0
        fail_msg: >-
          slack_webhook_url_environment が未設定。ansible/inventory/group_vars/monitoring/secrets.sops.yml に
          sops で追加すること（docs/operations/runbooks/05-slack-alerts.md参照）。

    - name: Fail early if heartbeat ping URL is not in secrets
      ansible.builtin.assert:
        that:
          - heartbeat_ping_url is defined
          - heartbeat_ping_url | length > 0
        fail_msg: >-
          heartbeat_ping_url が未設定。ansible/inventory/group_vars/monitoring/secrets.sops.yml に
          sops で追加すること（docs/architecture/lld/platform/monitoring.md の「外部 Heartbeat」参照）。

    - name: Fail early if Home Assistant token for Prometheus is not in secrets
      ansible.builtin.assert:
        that:
          - prometheus_ha_token is defined
          - prometheus_ha_token | length > 0
        fail_msg: >-
          prometheus_ha_token が未設定。Home Assistant で長期アクセストークン（prometheus）を作り、
          ansible/inventory/group_vars/monitoring/secrets.sops.yml に sops で追加すること
          （docs/architecture/lld/platform/monitoring.md の「室内の温度・湿度」参照）。

    # prometheus コンテナ（nobody）が読めるよう 0644。slack_webhook_url と同じ理由
    - name: Deploy Home Assistant token for Prometheus
      ansible.builtin.copy:
        content: "{{ prometheus_ha_token }}"
        dest: /opt/monitoring/prometheus/ha_token
        mode: "0644"
      no_log: true

    - name: Fail early if AdGuard exporter password is not in secrets
      ansible.builtin.assert:
        that:
          - adguard_exporter_password is defined
          - adguard_exporter_password | length > 0
        fail_msg: >-
          adguard_exporter_password が未設定。ansible/inventory/group_vars/all/secrets.sops.yml に
          sops で追加すること（docs/architecture/lld/platform/monitoring.md の「AdGuard Home の統計」参照）。

    - name: Create adguard-exporter directory
      ansible.builtin.file:
        path: /opt/monitoring/adguard-exporter
        state: directory
        mode: "0755"

    # exporter は scratch イメージで UID 65532 として動く。その UID だけが読めるようにする
    - name: Deploy AdGuard exporter password
      ansible.builtin.copy:
        content: "{{ adguard_exporter_password }}"
        dest: /opt/monitoring/adguard-exporter/password
        owner: "65532"
        group: "65532"
        mode: "0400"
      no_log: true

    - name: Fail early if Omada exporter credentials are not in secrets
      ansible.builtin.assert:
        that:
          - omada_exporter_password is defined
          - omada_exporter_password | length > 0
          - omada_exporter_client_id is defined
          - omada_exporter_client_id | length > 0
          - omada_exporter_client_secret is defined
          - omada_exporter_client_secret | length > 0
        fail_msg: >-
          omada_exporter_password・omada_exporter_client_id・omada_exporter_client_secret のどれかが未設定。
          ansible/inventory/group_vars/monitoring/secrets.sops.yml に sops で追加すること
          （docs/architecture/lld/platform/monitoring.md の「Omada の機器・クライアントの状態」参照）。

    - name: Create omada-exporter directory
      ansible.builtin.file:
        path: /opt/monitoring/omada-exporter
        state: directory
        mode: "0755"

    # exporter は環境変数でしか認証情報を受け取れない。compose の env_file は Docker（root）が読むので、
    # root だけが読める 0600 にする（ADR-0039）
    - name: Deploy Omada exporter credentials
      ansible.builtin.copy:
        content: |
          OMADA_PASS={{ omada_exporter_password }}
          OMADA_CLIENT_ID={{ omada_exporter_client_id }}
          OMADA_SECRET_ID={{ omada_exporter_client_secret }}
        dest: /opt/monitoring/omada-exporter/secrets.env
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Create blackbox config directory
      ansible.builtin.file:
        path: /opt/monitoring/blackbox
        state: directory
        mode: "0755"

    - name: Copy blackbox.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/monitoring/blackbox/blackbox.yml"
        dest: /opt/monitoring/blackbox/blackbox.yml
        mode: "0644"

    - name: Create alertmanager config directory
      ansible.builtin.file:
        path: /opt/monitoring/alertmanager
        state: directory
        mode: "0755"

    - name: Copy alertmanager.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/monitoring/alertmanager/alertmanager.yml"
        dest: /opt/monitoring/alertmanager/alertmanager.yml
        mode: "0644"

    # alertmanager コンテナ (nobody) が読めるよう 0644。ホストは SSH 鍵のみ・UFW で保護
    - name: Deploy Slack webhook URL
      ansible.builtin.copy:
        content: "{{ slack_webhook_url }}"
        dest: /opt/monitoring/alertmanager/slack_webhook_url
        mode: "0644"
      no_log: true

    # slack_webhook_url と同じ理由で 0644
    - name: Deploy Slack webhook URL for warnings
      ansible.builtin.copy:
        content: "{{ slack_webhook_url_warning }}"
        dest: /opt/monitoring/alertmanager/slack_webhook_url_warning
        mode: "0644"
      no_log: true

    # slack_webhook_url と同じ理由で 0644
    - name: Deploy Slack webhook URL for room environment
      ansible.builtin.copy:
        content: "{{ slack_webhook_url_environment }}"
        dest: /opt/monitoring/alertmanager/slack_webhook_url_environment
        mode: "0644"
      no_log: true

    # slack_webhook_url と同じ理由で 0644
    - name: Deploy heartbeat ping URL
      ansible.builtin.copy:
        content: "{{ heartbeat_ping_url }}"
        dest: /opt/monitoring/alertmanager/heartbeat_ping_url
        mode: "0644"
      no_log: true

    - name: Create grafana provisioning directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /opt/monitoring/grafana/provisioning/datasources
        - /opt/monitoring/grafana/provisioning/dashboards/json

    - name: Copy grafana datasource config
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/monitoring/grafana/provisioning/datasources/prometheus.yml"
        dest: /opt/monitoring/grafana/provisioning/datasources/prometheus.yml
        mode: "0644"

    - name: Copy grafana dashboard provisioning config
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/monitoring/grafana/provisioning/dashboards/dashboards.yml"
        dest: /opt/monitoring/grafana/provisioning/dashboards/dashboards.yml
        mode: "0644"

    - name: Copy storage (thin pool) dashboard
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/monitoring/grafana/dashboards/storage.json"
        dest: /opt/monitoring/grafana/provisioning/dashboards/json/storage.json
        mode: "0644"

    - name: Copy internet connectivity dashboard
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/monitoring/grafana/dashboards/internet-connectivity.json"
        dest: /opt/monitoring/grafana/provisioning/dashboards/json/internet-connectivity.json
        mode: "0644"

    - name: Copy room environment dashboard
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/monitoring/grafana/dashboards/room-environment.json"
        dest: /opt/monitoring/grafana/provisioning/dashboards/json/room-environment.json
        mode: "0644"

    - name: Copy AdGuard Home dashboard
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/monitoring/grafana/dashboards/adguard.json"
        dest: /opt/monitoring/grafana/provisioning/dashboards/json/adguard.json
        mode: "0644"

    # Omada Overview から Device Details へは、uid でリンクしている。2 つとも置く
    - name: Copy Omada dashboards
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose/monitoring/grafana/dashboards/{{ item }}"
        dest: "/opt/monitoring/grafana/provisioning/dashboards/json/{{ item }}"
        mode: "0644"
      loop:
        - omada-overview.json
        - omada-device-details.json

    - name: Download Node Exporter Full dashboard
      ansible.builtin.get_url:
        url: https://grafana.com/api/dashboards/1860/revisions/latest/download
        dest: /opt/monitoring/grafana/provisioning/dashboards/json/node-exporter-full.json
        mode: "0644"

    # ESP32 の温湿度ダッシュボードは、Home Assistant から取る「Room Environment」に置き換えた。
    # ファイルを消すと、Grafana のプロビジョニング（disableDeletion: false）がダッシュボードも消す
    - name: Remove retired ESP32 environment dashboard
      ansible.builtin.file:
        path: /opt/monitoring/grafana/provisioning/dashboards/json/esp32-environment.json
        state: absent

    - name: Start monitoring stack
      community.docker.docker_compose_v2:
        project_src: /opt/monitoring
        state: present

    - name: Restart monitoring services to load config changes
      community.docker.docker_compose_v2:
        project_src: /opt/monitoring
        services:
          - prometheus
          - alertmanager
          - blackbox-exporter
          - adguard-exporter
          - omada-exporter
          - grafana
        state: restarted
