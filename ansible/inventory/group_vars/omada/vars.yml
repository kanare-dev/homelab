---
# omada グループ変数（vm-omada: Omada コントローラー）

# UFW
# コンテナは host ネットワークで動く（機器の自動検出が L2 のブロードキャストに頼るため）。
# Docker の公開ポートではないので、roles/ufw_docker は使わず、ここで絞る。
ufw_allowed_ports:
  - { port: 22,            proto: tcp }
  - { port: 9100,          proto: tcp, from: "192.168.11.13" }   # node_exporter (Prometheus on vm-monitoring)
  - { port: 8043,          proto: tcp, from: "192.168.11.11" }   # 管理画面 HTTPS（Caddy on vm-infra: omada.lab.kanare.dev）。初回の設定は SSH のポートフォワード: ssh -L 8043:localhost:8043 vm-omada
  - { port: 29810,         proto: udp, from: "192.168.11.0/24" } # 機器の自動検出
  - { port: "29811:29816", proto: tcp, from: "192.168.11.0/24" } # 機器との通信（管理、採用、更新、データ転送、RPC）

# VLAN 化（切り替え当日）に、機器が届く元を Management（10.77.10.0/24）へ変える。
# ER605 は VLAN ごとのアドレスを持つので、送信元になりうる範囲を確認してから書き換える。
