---
# omada グループ変数（vm-omada: Omada コントローラー）

# UFW
# コンテナは host ネットワークで動く（機器の自動検出が L2 のブロードキャストに頼るため）。
# Docker の公開ポートではないので、roles/ufw_docker は使わず、ここで絞る。
ufw_allowed_ports:
  - { port: 22,            proto: tcp }
  - { port: 9100,          proto: tcp, from: "10.77.20.11" }   # node_exporter (Prometheus on vm-monitoring)
  - { port: 8043,          proto: tcp, from: "10.77.20.10" }     # 管理画面 HTTPS（Caddy on vm-infra: omada.lab.kanare.dev）。初回の設定は SSH のポートフォワード: ssh -L 8043:localhost:8043 vm-omada
  - { port: 8043,          proto: tcp, from: "192.168.11.0/24" } # 機器がファームウェアのファイルをダウンロードする（HTTPS 管理ポート）。絞ると、機器の更新が「ダウンロードに失敗」で止まる
  - { port: 29810,         proto: udp, from: "192.168.11.0/24" } # 機器の自動検出
  - { port: "29811:29816", proto: tcp, from: "192.168.11.0/24" } # 機器との通信（管理、採用、更新、データ転送、RPC）

# 機器（ER605・SG2210P）は、段階 3b まで今の LAN（192.168.11.0/24）に残るので、機器向けの許可元は変えない（ADR-0028）。
# 段階 3b で、機器が届く元を Management（10.77.10.0/24）へ変える。ER605 は VLAN ごとのアドレスを持つので、
# 送信元になりうる範囲を確認してから書き換える。

# 段階 3 で、許可元を新しいアドレスに変えたあと、旧アドレスのルールを消す（ufw は定義にないルールを消さない）
ufw_removed_ports:
  - { port: 9100, proto: tcp, from: "192.168.11.13" }
  - { port: 8043, proto: tcp, from: "192.168.11.11" }
