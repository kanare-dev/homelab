---
# monitoring グループ変数

grafana_admin_user: admin

prometheus_port: 9090
alertmanager_port: 9093
grafana_port: 3000

# UFW
ufw_allowed_ports:
  - { port: 22, proto: tcp }
  - { port: 9100, proto: tcp, from: "10.77.20.11" }   # node_exporter (自分自身。ホストからの scrape)
  - { port: 9100, proto: tcp, from: "172.16.0.0/12" }   # node_exporter (Prometheus コンテナ。Docker ブリッジ)

# Docker の公開ポートは UFW では絞れないので、roles/ufw_docker が DOCKER-USER で絞る
docker_published_allow:
  - { port: 3000, from: "10.77.20.10" }   # Grafana (Caddy on vm-infra)
  - { port: 9090, from: "10.77.20.10" }   # Prometheus (Caddy)
  - { port: 9093, from: "10.77.20.10" }   # Alertmanager (Caddy)

# 許可元を絞る前の「どこからでも許可」ルール。common ロールが削除する
ufw_removed_ports:
  - { port: 3000, proto: tcp }
  - { port: 9090, proto: tcp }
  - { port: 9093, proto: tcp }
  - { port: 9100, proto: tcp }
  # 段階 3 で、許可元を新しいアドレスに変えたあと、旧アドレスのルールを消す（ufw は定義にないルールを消さない）
  - { port: 9100, proto: tcp, from: "192.168.11.13" }
