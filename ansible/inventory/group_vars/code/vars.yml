---
# code グループ変数

code_server_port: 8080

cloudcli_port: 3001

# 追加で authorized_keys に登録する公開鍵（デバイス単位で管理。秘密鍵はコミットしない）
code_extra_authorized_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILg3DREcyvs31MMZdbvyN+mvEf4SYWf85mk14kDMoVoq moshi-ios@vm-code"
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJbCWNceSwgcSgMRwtUu+OU1mC6X5Tki01S2u5ahCmnR moshi-ipad@vm-code"

# UFW: code-server / cloudcli / mosh は LAN（Tailscale サブネットルート経由含む）からのみ許可
ufw_allowed_ports:
  - { port: 22,          proto: tcp }
  - { port: 8080,        proto: tcp, from: "192.168.11.0/24" }   # code-server
  - { port: 3001,        proto: tcp, from: "192.168.11.0/24" }   # CloudCLI (Claude Code UI)
  - { port: "60000:61000", proto: udp, from: "192.168.11.0/24" }  # mosh
  - { port: 5173,        proto: tcp, from: "192.168.11.0/24" }   # 開発用サーバ（Vite）。vm-code 上の開発を手元の端末から確認する
  - { port: 9100,        proto: tcp, from: "192.168.11.13" }   # node_exporter (Prometheus on vm-monitoring)

# 許可元を絞る前の「どこからでも許可」ルール。common ロールが削除する
ufw_removed_ports:
  - { port: 9100, proto: tcp }
